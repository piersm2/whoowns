<title>RHTP Navigator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F5F7F5;--surface:#FFFFFF;--surface2:#ECF0ED;--line:#D5DCD7;--ink:#1B2420;--muted:#5F6B66;
  --accent:#1E6B5C;--accent-ink:#FFFFFF;--accent-soft:#DCEDE7;
  --good:#2C7A4B;--good-soft:#DDF0E3;--warn:#9A6A12;--warn-soft:#F7ECD2;--bad:#B23F2E;--bad-soft:#F6DEDA;--info-soft:#E1E9F2;--info:#2F5C86;
  --shadow:0 1px 2px rgba(20,30,26,.06),0 4px 14px rgba(20,30,26,.05);
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131917;--surface:#1B2320;--surface2:#232C28;--line:#31403A;--ink:#E6ECE8;--muted:#98A6A0;
  --accent:#5FB9A3;--accent-ink:#0F1A17;--accent-soft:#1E332D;
  --good:#6CC28C;--good-soft:#1C3325;--warn:#E0B054;--warn-soft:#3A2E14;--bad:#EF8A78;--bad-soft:#3E211C;--info-soft:#1F2E3C;--info:#8FBBE3;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#131917;--surface:#1B2320;--surface2:#232C28;--line:#31403A;--ink:#E6ECE8;--muted:#98A6A0;
  --accent:#5FB9A3;--accent-ink:#0F1A17;--accent-soft:#1E332D;
  --good:#6CC28C;--good-soft:#1C3325;--warn:#E0B054;--warn-soft:#3A2E14;--bad:#EF8A78;--bad-soft:#3E211C;--info-soft:#1F2E3C;--info:#8FBBE3;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
a{color:var(--accent)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{padding:0 8px 16px}
.brand strong{display:block;font-size:1.05rem;letter-spacing:-.01em}
.brand span{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
nav.rail button{all:unset;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink);font-weight:500;font-size:.92rem}
nav.rail button:hover{background:var(--surface2)}
nav.rail button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.rail button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav.rail .count{font-family:var(--mono);font-size:.72rem;color:var(--muted);font-weight:400}
nav.rail .foot{margin-top:auto;font-size:.76rem;color:var(--muted);padding:12px 8px 0;border-top:1px solid var(--line);display:grid;gap:6px}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1240px;width:100%}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.head p{color:var(--muted);max-width:66ch;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:500;font-size:.88rem;padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 8px;font-size:.8rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.cols-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--mono);font-size:1.6rem;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.alert{padding:10px 14px;border-radius:6px;font-size:.9rem;margin-bottom:10px;border:1px solid transparent}
.alert.danger{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert.good{background:var(--good-soft);color:var(--good)}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.badge.green{background:var(--good-soft);color:var(--good)}
.badge.amber{background:var(--warn-soft);color:var(--warn)}
.badge.red{background:var(--bad-soft);color:var(--bad)}
.badge.blue{background:var(--accent-soft);color:var(--accent)}
.bar{height:7px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.bar.green i{background:var(--good)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{all:unset;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.muted{color:var(--muted)}.small{font-size:.82rem}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.field{display:grid;gap:4px}
.field>span{font-size:.8rem;font-weight:600;color:var(--muted)}
.field .help{font-weight:400;font-size:.76rem}
.span2{grid-column:span 2}
@media (max-width:560px){.span2{grid-column:span 1}}
input,select,textarea{font:inherit;font-size:.92rem;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
input[type=number],.num input{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input.inline,select.inline{padding:4px 7px;font-size:.84rem;width:auto}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:600;border-top:2px solid var(--ink)}
.wrap{overflow-x:auto}
.cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:16px 0 6px}
.cat:first-child{margin-top:0}
.row{display:grid;grid-template-columns:auto 1fr auto auto auto auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:600}.row .d{font-size:.82rem;color:var(--muted);margin-top:2px;max-width:62ch}
.row.done .t{text-decoration:line-through;color:var(--muted)}
@media (max-width:820px){.row{grid-template-columns:auto 1fr;}.row>*:nth-child(n+3){grid-column:2}}
.split{display:grid;grid-template-columns:270px 1fr;gap:14px}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.seclist button{all:unset;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:.9rem}
.seclist button:hover{background:var(--surface2)}
.seclist button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.editor textarea{min-height:440px;font-size:.95rem;line-height:1.6}
.ph{color:var(--warn)}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
ul.list li:last-child{border-bottom:0}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:.88rem;box-shadow:var(--shadow);z-index:50;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.question{display:grid;gap:4px;margin-bottom:16px}
.question .q{font-weight:500}
.question .h{font-size:.78rem;color:var(--muted)}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav.rail{position:sticky;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px 12px;gap:2px;z-index:10;border-right:0;border-bottom:1px solid var(--line)}
  .brand{width:100%;padding:4px 6px 8px}
  nav.rail button{padding:6px 9px;font-size:.84rem}
  nav.rail .count,nav.rail .foot{display:none}
  main{padding-top:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
  <nav class="rail" id="nav"></nav>
  <main id="main"></main>
</div>

// ---------- computed ----------
function budgetSummary(){
  const byYear=[0,0,0,0,0],byCategory={},byType={};let grand=0,missing=0;
  for(const b of S.budget){const t=lineTotal(b);grand+=t;YEARS.forEach((y,i)=>byYear[i]+=Number(b['year'+y]||0));byCategory[b.category_code]=(byCategory[b.category_code]||0)+t;byType[b.cost_type]=(byType[b.cost_type]||0)+t;if(!b.justification.trim())missing++;}
  const h=S.hospital;const basis=h.awarded_amount||h.requested_amount||grand;
  const caps=[{key:'admin',label:'Administrative (indirect) costs',share:.10,amount:byType.indirect||0},{key:'capital',label:'Capital and construction',share:.20,amount:byType.construction||0},{key:'provider',label:'Provider payments (Use B)',share:.20,amount:byCategory.B||0}].map(c=>({...c,limit:basis*c.share,exceeded:basis>0&&c.amount>basis*c.share}));
  return {byYear,byCategory,byType,grand,missing,basis,caps,lines:S.budget.length};
}
function ledgerSummary(){
  let drawn=0,spent=0;const byCat={};
  for(const b of S.budget){(byCat[b.category_code]??={budget:0,spent:0}).budget+=lineTotal(b);}
  for(const e of S.ledger){if(e.direction==='drawdown')drawn+=e.amount;else{spent+=e.amount;if(e.category_code)(byCat[e.category_code]??={budget:0,spent:0}).spent+=e.amount;}}
  return {award:S.hospital.awarded_amount||0,drawn,spent,cashOnHand:drawn-spent,remaining:(S.hospital.awarded_amount||0)-spent,byCat};
}
function phaseStats(p){const items=S.checklist.filter(c=>c.phase===p&&c.status!=='na');return {total:items.length,complete:items.filter(c=>c.status==='complete').length,blocked:items.filter(c=>c.status==='blocked').length,required_open:items.filter(c=>c.is_required&&c.status!=='complete').length};}
function selectedCategories(){const codes=[...new Set(S.budget.map(b=>b.category_code))].sort();return codes.map(c=>({code:c,title:usesTitle(c)}));}

// ---------- narrative drafter ----------
function ans(a,key,ph){const v=(a[key]||'').trim();return v||`[${ph}]`;}
function lines(t){return (t||'').split(/\r?\n/).map(s=>s.replace(/^[-*\d.)\s]+/,'').trim()).filter(Boolean);}
function sentenceList(items){if(!items.length)return '';if(items.length===1)return items[0];return `${items.slice(0,-1).join(', ')}, and ${items[items.length-1]}`;}
function draftSection(key){
  const h=S.hospital,a=S.answers,categories=selectedCategories(),budget=S.budget;
  const name=h.name||'[Hospital name]';const projectName=ans(a,'project_name','Project name');
  const catList=categories.length?sentenceList(categories.map(c=>`Use ${c.code} (${c.title})`)):'[select use-of-funds categories on the Budget tab]';
  const where=[h.county?`${h.county} County`:'',h.state].filter(Boolean).join(', ')||'[county, state]';
  const intro=`${name} is a ${TYPE_LABEL[h.facility_type]||'rural provider'}${h.licensed_beds?` with ${h.licensed_beds} licensed beds`:''} located in ${where}.`;
  switch(key){
    case 'need':return [`${intro} ${ans(a,'service_area','Describe the service area, population, and distance to the next hospital')}`,`The community faces significant health challenges. ${ans(a,'health_challenges','Summarize the top health problems from your CHNA and county health rankings')}`,`Access to care is limited. ${ans(a,'access_gaps','Describe missing or at-risk services and barriers such as transportation')}`,`These gaps persist in part because of the hospital's financial position. ${ans(a,'financial_pressure','Describe operating margin, days cash, payer mix, and uncompensated care')} Without new investment, the hospital's ability to maintain and expand services for the community is at risk.`].join('\n\n');
    case 'project':{const acts=lines(a.activities);const actText=acts.length?`The project includes the following activities:\n\n${acts.map((s,i)=>`${i+1}. ${s}`).join('\n')}`:'[List the specific activities or purchases, one per line]';
      return [`${name} proposes ${projectName}, a project aligned with the state's approved Rural Health Transformation Program plan and with ${catList}.`,ans(a,'project_summary','Describe in plain words what you want to do with the money'),actText,`The project will serve ${ans(a,'people_served','Who is served and roughly how many per year')}. Each activity is designed to supplement, not supplant, existing services and funding, adding new capacity that the hospital cannot currently support from operating revenue.`].join('\n\n');}
    case 'workforce':{const usesE=categories.some(c=>c.code==='E');return [`${name} will strengthen its rural clinical workforce as part of ${projectName}. ${ans(a,'workforce_plan','Describe positions to recruit, retain, or train and how you will recruit')}`,usesE?'Consistent with Use E, every clinician supported with recruitment or retention funding will sign a written commitment to serve the rural community for a minimum of five years, with prorated repayment terms if the commitment is not met. The hospital will track service obligations and report on retention annually.':'Where recruitment or retention incentives are used, the hospital will document the service commitment and track retention so the state can report on workforce outcomes.'].join('\n\n');}
    case 'technology':return [`${name} will invest in technology that improves efficiency, cybersecurity, and patient outcomes. ${ans(a,'technology_plan','Describe systems, what problem each fixes, and expected improvements')}`,'The hospital will follow its procurement policy for each purchase, obtain competitive quotes where required by the state, and maintain an equipment inventory for items over the applicable threshold. Cybersecurity work will be documented against a recognized framework so improvements can be measured and reported.'].join('\n\n');
    case 'outcomes':return [`${projectName} will be evaluated against measurable outcomes with a documented baseline, a target, and a data source for each. ${ans(a,'outcomes','State what will be different in 1 year and in 5 years, with numbers')}`,`Outcome data will be drawn from ${ans(a,'data_sources','EHR reports, claims, HR records, surveys, or state data')}. The project director will review progress quarterly, compare results to targets, and report variances and corrective actions to the state on the required schedule.`].join('\n\n');
    case 'partnerships':return [`${name} will implement ${projectName} in coordination with community and regional partners. ${ans(a,'partners','List each partner and what it contributes')}`,'Partner roles will be documented in letters of support or written agreements, and the hospital will convene partners at least quarterly to coordinate services, share data where permitted, and avoid duplication.'].join('\n\n');
    case 'sustainability':return [`The hospital has planned for continuation of ${projectName} beyond the award period. ${ans(a,'sustainability','Describe new revenue, savings, payer contracts, or how costs are absorbed')}`,'Costs that are one-time (equipment, implementation, start-up recruitment) are front-loaded in the budget, and recurring costs are stepped down over the project period so that the hospital operating budget can carry them by the final year.'].join('\n\n');
    case 'capacity':return [ans(a,'capacity','Name who manages the project and the money, past grant experience, and financial controls'),`The hospital maintains separate general ledger accounts for the award, reconciles the award ledger to the general ledger monthly, and follows written procurement, allowable cost, and time and effort procedures. ${h.uei?`The hospital's UEI is ${h.uei}`:'[UEI]'}${h.sam_expiration?` and its SAM.gov registration is active through ${fmtDate(h.sam_expiration)}.`:' and its SAM.gov registration is active.'}`,`Key risks and mitigation: ${ans(a,'risks','What could go wrong and the backup plan')}`].join('\n\n');
    case 'budget_narrative':{if(!budget.length)return '[Add budget lines on the Budget tab, then regenerate this section]';const byType={};for(const b of budget)(byType[b.cost_type]??=[]).push({...b,total:lineTotal(b)});const grand=Object.values(byType).flat().reduce((s,b)=>s+b.total,0);
      const parts=[`The total requested budget for ${projectName} is ${money(grand)} over the project period${h.awarded_amount?`, against an award of ${money(h.awarded_amount)}`:''}. Costs are summarized by category below.`];
      for(const [type,items] of Object.entries(byType)){const sub=items.reduce((s,b)=>s+b.total,0);parts.push(`${label(type)} (${money(sub)}):\n${items.map(b=>`- ${b.line_item} (Use ${b.category_code}), ${money(b.total)}. ${b.justification||'[justification needed]'}`).join('\n')}`);}
      parts.push('All costs are necessary, reasonable, and allocable to the project, and were estimated using current vendor quotes, salary schedules, or historical costs. No funds will be used to supplant existing federal or state funding.');return parts.join('\n\n');}
  }
  return '';
}
function exportPacket(){
  const h=S.hospital;const out=[`# ${h.name||'Hospital'}: Rural Health Transformation Program application packet`,'',`Generated ${today()}`,'',`Facility: ${TYPE_LABEL[h.facility_type]||''}, CCN ${h.ccn||'[CCN]'}, ${h.county?h.county+' County, ':''}${h.state||''}`,`Contact: ${h.contact_name||'[contact]'}${h.contact_title?', '+h.contact_title:''}${h.contact_email?', '+h.contact_email:''}`,`Amount requested: ${money(h.requested_amount)}`,''];

function download(name,text,type){
  // The hosted viewer only saves files through the downloads capability. If it is not
  // available, the text goes to the clipboard so nothing is lost.
  const fallback=()=>navigator.clipboard?.writeText(text).then(()=>toast(`Saving is unavailable here. ${name} was copied to your clipboard instead.`)).catch(()=>toast('Saving is unavailable in this view.'));
  const use=window.claude?.use;
  if(!use){fallback();return;}
  use.call(window.claude,'downloads').then(dl=>{
    if(!dl)return fallback();
    return dl.save({filename:name,data:text}).then(()=>toast(`${name} saved`)).catch(err=>{
      if(err?.code==='declined')return;
      if(err?.code==='rate_limited'){toast('One save at a time. Try again in a moment.');return;}
      fallback();
    });
  }).catch(fallback);
}

    ${s.cashOnHand<0?`<div class="alert warn" style="margin-top:12px">Expenditures exceed drawdowns by ${money(-s.cashOnHand)}. Submit a reimbursement request or check for missing drawdown entries.</div>`:''}
    <form class="card" data-form="ledger" style="margin-top:14px"><h2>Record an entry</h2><div class="form" style="margin-top:10px">${field('Date',`<input name="entry_date" id="l_date" type="date" value="${today()}" required>`)}${field('Type','<select name="direction" id="l_dir"><option value="expenditure">Expenditure</option><option value="drawdown">Drawdown (funds received)</option></select>')}${field('Amount','<input name="amount" id="l_amt" type="number" min="0.01" step="0.01" required>')}${field('Use of funds',`<select name="category_code" id="l_cat"><option value="">None</option>${USES.map(u=>`<option value="${u[0]}">${u[0]}. ${esc(u[1])}</option>`).join('')}</select>`)}${field('Cost type',`<select name="cost_type" id="l_type">${COST_TYPES.map(t=>`<option value="${t}"${t==='other'?' selected':''}>${label(t)}</option>`).join('')}</select>`)}${field('Vendor','<input name="vendor" id="l_vendor">')}${field('Invoice or check number','<input name="invoice_ref" id="l_ref">')}${field('Description','<input name="description" id="l_desc">','',true)}${field('Backup document link','<input name="doc_link" id="l_doc" placeholder="Invoice, payroll register, or receipt">','',true)}</div><div class="actions" style="margin-top:10px"><button class="btn primary">Record</button></div></form>
    <div class="grid cols-2" style="margin-top:14px"><div class="card wrap"><h3>Budget vs actual by use of funds</h3><table style="margin-top:8px"><thead><tr><th>Use</th><th class="num">Budget</th><th class="num">Spent</th><th class="num">Remaining</th></tr></thead><tbody>${Object.entries(s.byCat).sort().map(([c,v])=>`<tr><td>${badge(c,'blue')} ${esc(usesTitle(c))}</td><td class="num">${money(v.budget)}</td><td class="num">${money(v.spent)}</td><td class="num" style="color:${v.budget-v.spent<0?'var(--bad)':'inherit'}">${money(v.budget-v.spent)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Add budget lines and expenditures to compare.</td></tr>'}</tbody></table></div>
    <div class="card"><h3>Monthly close checklist</h3><ul style="padding-left:18px;margin:8px 0 0" class="small"><li>Every expenditure has an invoice or payroll backup linked</li><li>Ledger total matches the RHTP cost center in the general ledger</li><li>Drawdown requests match expenditures since the last request</li><li>Personnel charges have time and effort documentation</li><li>Equipment over the threshold is tagged in the inventory</li></ul></div></div>
    <div class="card wrap" style="margin-top:14px"><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Use</th><th>Vendor</th><th>Ref</th><th class="num">Amount</th><th></th></tr></thead><tbody>${list.length?list.map(x=>`<tr data-id="${x.id}"><td>${fmtDate(x.entry_date)}</td><td>${badge(label(x.direction),x.direction==='drawdown'?'green':'')}</td><td>${esc(x.description)}${x.doc_link?`<div class="small"><a href="${esc(x.doc_link)}" target="_blank" rel="noreferrer">Backup</a></div>`:''}</td><td>${x.category_code?badge(x.category_code,'blue'):''}</td><td class="small">${esc(x.vendor)}</td><td class="small">${esc(x.invoice_ref)}</td><td class="num" style="color:${x.direction==='drawdown'?'var(--good)':'inherit'}">${x.direction==='drawdown'?'+':'−'}${money(x.amount,2)}</td><td><button class="btn sm danger" data-l="delete">✕</button></td></tr>`).join(''):'<tr><td colspan="8" class="muted">No ledger entries yet.</td></tr>'}</tbody></table></div>`;
}

function Documents(){
  const TYPES=['award','assurance','financial','chna','quote','letter','report','invoice','submission','policy','other'];
  return head('Documents','An index of where every audit-ready document lives: award letter, assurances, CHNA, quotes, letters of support, submitted reports, invoices. This version stores links, not files, so point each entry at your shared drive or the state portal.')+
    `<form class="card" data-form="doc"><div class="form">${field('Title','<input name="title" id="d_title" required>','',true)}${field('Type',`<select name="doc_type" id="d_type">${TYPES.map(t=>`<option value="${t}">${label(t)}</option>`).join('')}</select>`)}${field('Link','<input name="external_link" id="d_link" placeholder="https://" required>','Shared drive, portal, or document system',true)}${field('Notes','<input name="notes" id="d_notes">','',true)}</div><div class="actions" style="margin-top:10px"><button class="btn primary">Add document</button></div></form>
    <div class="card wrap"><table><thead><tr><th>Title</th><th>Type</th><th>Link</th><th>Added</th><th></th></tr></thead><tbody>${S.documents.length?S.documents.map(d=>`<tr data-id="${d.id}"><td><strong>${esc(d.title)}</strong>${d.notes?`<div class="small muted">${esc(d.notes)}</div>`:''}</td><td>${badge(label(d.doc_type))}</td><td class="small"><a href="${esc(d.external_link)}" target="_blank" rel="noreferrer">Open</a></td><td class="small muted">${fmtDate(d.created_at)}</td><td><button class="btn sm danger" data-d="delete">✕</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted">No documents yet.</td></tr>'}</tbody></table></div>`;
}

function Program(){
  return head('Program reference','What the Rural Health Transformation Program is, what money can be used for, and how your state is running it. Facts marked "verify" are reported guardrails to confirm against the CMS NOFO.')+
    `<div class="tabs">${[['overview','Overview and dates'],['uses','Use of funds (A to J)'],['state','Your state']].map(([k,l])=>`<button data-prog="${k}" class="${ui.progTab===k?'on':''}">${l}</button>`).join('')}</div>`+
    (ui.progTab==='overview'?`<div class="grid cols-2">${[...new Set(FACTS.map(f=>f[0]))].map(s=>`<div class="card"><h2>${esc(s)}</h2><div style="margin-top:10px">${FACTS.filter(f=>f[0]===s).map(f=>`<div style="margin-bottom:12px"><strong>${esc(f[1])}</strong>${/verify/i.test(f[1])?' '+badge('Verify','amber'):''}<div>${esc(f[2])}</div><div class="small muted">Source: ${esc(f[3])}</div></div>`).join('')}</div></div>`).join('')}</div>`
    :ui.progTab==='uses'?`<div class="alert info">States had to pick at least three of these. Your project should map to categories in your state's approved plan. Tag every budget line and milestone with a letter so reports roll up cleanly.</div><div class="grid cols-2">${USES.map(u=>`<div class="card"><h3>${badge(u[0],'blue')} ${esc(u[1])}</h3><p style="margin-top:8px">${esc(u[2])}</p><p class="small muted" style="margin-top:6px"><strong>Examples:</strong> ${esc(u[3])}</p></div>`).join('')}</div>`
    :StatePanel());
}
function StatePanel(){
  const code=ui.stateCode||S.hospital.state;const st=S.states[code];const name=(STATES.find(s=>s[0]===code)||[])[1];
  const known=STATES.filter(([a])=>S.states[a].fy2026_award);
  return `<div class="card"><div class="form">${field('State',`<select id="state-pick" data-act="pick-state"><option value="">Select</option>${opts(STATES,code)}</select>`)}</div>
    ${st?`<div style="margin-top:12px"><h2>${esc(name)}</h2><div class="form" style="margin-top:10px">${field('FY2026 award',`<input id="s_award" type="number" step="1000" data-s="fy2026_award" value="${st.fy2026_award??''}">`,'From the CMS award announcement')}${field('Verified against CMS',`<select id="s_ver" data-s="award_verified"><option value="0"${!st.award_verified?' selected':''}>Not verified</option><option value="1"${st.award_verified?' selected':''}>Verified</option></select>`)}${field('Lead agency',`<input id="s_agency" data-s="lead_agency" value="${esc(st.lead_agency)}" placeholder="State Medicaid agency, health department, office of rural health">`)}${field('Program contact email',`<input id="s_email" data-s="contact_email" value="${esc(st.contact_email)}">`)}${field('Program page',`<input id="s_url" data-s="program_url" value="${esc(st.program_url)}" placeholder="https://">`,'',true)}${field('Provider application opens',`<input id="s_open" type="date" data-s="provider_application_open" value="${esc(st.provider_application_open)}">`)}${field('Provider application due',`<input id="s_due" type="date" data-s="provider_application_due" value="${esc(st.provider_application_due)}">`)}${field('Notes',`<textarea id="s_notes" data-s="notes">${esc(st.notes)}</textarea>`,'Caps the state passes down, match requirements, portal quirks, TA sessions',true)}</div>
    <div class="actions" style="margin-top:10px">${st.program_url?`<a class="btn" href="${esc(st.program_url)}" target="_blank" rel="noreferrer">Open program page</a>`:''}${st.provider_application_due?`<span class="small muted">Due ${fmtDate(st.provider_application_due)}</span>`:''}<span class="small muted">Saves as you type</span></div></div>`:''}</div>
    <div class="card"><h3>Awards entered so far</h3><p class="small muted" style="margin-top:4px">Only figures confirmed in public reporting were pre-filled (Texas and New Jersey, the high and low). Enter the rest from the CMS award list as you confirm them.</p><table style="margin-top:8px"><tbody>${known.map(([a,n])=>`<tr><td>${esc(n)}</td><td class="num">${money(S.states[a].fy2026_award)}</td><td>${badge(S.states[a].award_verified?'Verified':'Unverified',S.states[a].award_verified?'green':'amber')}</td></tr>`).join('')}</tbody></table></div>`;
}

// ---------- events ----------
const formData=(f)=>Object.fromEntries(new FormData(f).entries());
document.addEventListener('click',(e)=>{
  const el=e.target.closest('[data-go],[data-phase],[data-nar],[data-sec],[data-comp],[data-prog],[data-act],[data-c],[data-b],[data-r],[data-m],[data-l],[data-d]');if(!el)return;
  if(el.dataset.go){e.preventDefault();go(el.dataset.go);return;}
  if(el.dataset.phase){ui.phase=el.dataset.phase;render();return;}
  if(el.dataset.nar){ui.narTab=el.dataset.nar;render();return;}
  if(el.dataset.sec){ui.section=el.dataset.sec;render();return;}
  if(el.dataset.comp){ui.compTab=el.dataset.comp;render();return;}
  if(el.dataset.prog){ui.progTab=el.dataset.prog;render();return;}
  const id=Number(el.closest('[data-id]')?.dataset.id);
  if(el.dataset.c==='delete'&&confirm('Delete this item?')){S.checklist=S.checklist.filter(c=>c.id!==id);commit('Deleted checklist item');render();return;}
  if(el.dataset.b==='edit'){ui.editBudget={...S.budget.find(b=>b.id===id)};render();window.scrollTo({top:0,behavior:'smooth'});return;}
  if(el.dataset.b==='delete'&&confirm('Delete this line?')){S.budget=S.budget.filter(b=>b.id!==id);commit('Deleted budget line');render();return;}
  if(el.dataset.r==='delete'&&confirm('Delete this report?')){S.reports=S.reports.filter(r=>r.id!==id);commit('Deleted report');render();return;}
  if(el.dataset.m==='delete'&&confirm('Delete this milestone?')){S.milestones=S.milestones.filter(m=>m.id!==id);commit('Deleted milestone');render();return;}
  if(el.dataset.l==='delete'&&confirm('Delete this entry?')){S.ledger=S.ledger.filter(x=>x.id!==id);commit('Deleted ledger entry');render();return;}
  if(el.dataset.d==='delete'&&confirm('Delete this document?')){S.documents=S.documents.filter(x=>x.id!==id);commit('Deleted document');render();return;}
  const act=el.dataset.act;if(!act)return;
  if(act==='toggle-add'){ui.showAdd[el.dataset.k]=!ui.showAdd[el.dataset.k];render();}
  else if(act==='cancel-edit'){ui.editBudget=null;render();}
  else if(act==='export-md')exportPacket();
  else if(act==='export-csv')exportCsv();
  else if(act==='export-json')download(`rhtp-backup-${today()}.json`,JSON.stringify(S,null,2),'application/json');
  else if(act==='reset'){if(confirm('Erase everything in this browser and start with a blank hospital? Export a backup first if you need one.')){S=freshState();commit('Reset');go('profile');}}
  else if(act==='gen-one'){const sec=S.sections[ui.section];if(sec.content.trim()&&!confirm('Replace the current text with a fresh draft?'))return;sec.content=draftSection(ui.section);if(sec.status==='empty')sec.status='draft';const ph=(sec.content.match(/\[[^\]]+\]/g)||[]).length;commit(`Drafted ${SECTIONS.find(s=>s[0]===ui.section)[1]}`);render();toast(ph?`Draft generated with ${ph} placeholder${ph>1?'s':''} to fill`:'Draft generated');}
  else if(act==='gen-all'){if(!confirm('Generate drafts for every section that is still empty?'))return;let n=0;for(const [k] of SECTIONS){if(!S.sections[k].content.trim()){S.sections[k].content=draftSection(k);S.sections[k].status='draft';n++;}}commit(`Drafted ${n} sections`);render();toast(`${n} draft${n===1?'':'s'} generated`);}
  else if(act==='save-section'){S.sections[ui.section].content=document.getElementById('sec_'+ui.section).value;if(S.sections[ui.section].status==='empty'&&S.sections[ui.section].content.trim())S.sections[ui.section].status='draft';commit(`Saved ${SECTIONS.find(s=>s[0]===ui.section)[1]}`);render();toast('Saved');}
  else if(act==='gen-reports'){const start=S.hospital.project_start;if(!start){toast('Set the project start date on the Profile tab first');return;}let n=0;for(const [title,type,days] of DEFAULT_REPORTS){if(S.reports.some(r=>r.title===title))continue;const d=new Date(start+'T00:00:00');const pe=new Date(d);pe.setDate(pe.getDate()+days-1);const due=new Date(pe);due.setDate(due.getDate()+30);const ps=new Date(d);ps.setDate(ps.getDate()+Math.max(0,days-90));S.reports.push({id:nid(),title,report_type:type,period_start:(type==='performance'||days===365?start:ps.toISOString().slice(0,10)),period_end:pe.toISOString().slice(0,10),due_date:due.toISOString().slice(0,10),status:'upcoming',submitted_at:'',submitted_by:'',evidence_link:'',notes:'Default schedule, 30 days after period end. Replace with the dates in your state agreement.'});n++;}commit(`Generated ${n} report deadlines`);render();toast(n?'Default schedule added':'Default schedule already present');}
});
document.addEventListener('submit',(e)=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const d=formData(f);const kind=f.dataset.form;
  if(kind==='check'){S.checklist.push({id:nid(),phase:ui.phase,category:d.category||'State specific',title:d.title,description:d.description||'',is_required:0,status:'not_started',owner:d.owner||'',due_date:d.due_date||'',evidence_link:'',notes:''});ui.showAdd.check=false;commit(`Added checklist item: ${d.title}`);}
  else if(kind==='budget'){const line={category_code:d.category_code,cost_type:d.cost_type,line_item:d.line_item,justification:d.justification||''};YEARS.forEach(y=>line['year'+y]=Number(d['year'+y]||0));if(ui.editBudget){Object.assign(S.budget.find(b=>b.id===ui.editBudget.id),line);commit(`Updated budget line: ${d.line_item}`);ui.editBudget=null;}else{S.budget.push({id:nid(),...line});commit(`Added budget line: ${d.line_item}`);}}
  else if(kind==='report'){S.reports.push({id:nid(),title:d.title,report_type:d.report_type,period_start:d.period_start||'',period_end:d.period_end||'',due_date:d.due_date,status:'upcoming',submitted_at:'',submitted_by:'',evidence_link:'',notes:d.notes||''});ui.showAdd.report=false;commit(`Added report: ${d.title}`);}
  else if(kind==='ms'){S.milestones.push({id:nid(),title:d.title,description:d.description||'',category_code:d.category_code||'',owner:d.owner||'',due_date:d.due_date||'',status:'planned',metric:d.metric||'',target_value:d.target_value||'',actual_value:''});ui.showAdd.ms=false;commit(`Added milestone: ${d.title}`);}
  else if(kind==='ledger'){S.ledger.push({id:nid(),entry_date:d.entry_date,direction:d.direction,amount:Number(d.amount),category_code:d.direction==='drawdown'?'':d.category_code,cost_type:d.cost_type,description:d.description||'',vendor:d.vendor||'',invoice_ref:d.invoice_ref||'',doc_link:d.doc_link||''});commit(`Recorded ${d.direction} of ${money(d.amount)}`);}
  else if(kind==='doc'){S.documents.push({id:nid(),title:d.title,doc_type:d.doc_type,external_link:d.external_link,notes:d.notes||'',created_at:today()});commit(`Added document: ${d.title}`);}
  render();toast('Saved');
});
let saveT;const debounced=(fn)=>{clearTimeout(saveT);saveT=setTimeout(fn,500);};
document.addEventListener('input',(e)=>{
  const el=e.target;
  if(el.dataset.h!==undefined){const k=el.dataset.h;S.hospital[k]=el.type==='number'?Number(el.value||0):el.value;S.sample=false;debounced(()=>{save();renderNav();});return;}
  if(el.dataset.q!==undefined){S.answers[el.dataset.q]=el.value;debounced(save);return;}
  if(el.dataset.s!==undefined){const code=ui.stateCode||S.hospital.state;const st=S.states[code];if(!st)return;const k=el.dataset.s;st[k]=k==='fy2026_award'?(el.value===''?null:Number(el.value)):k==='award_verified'?Number(el.value):el.value;debounced(save);return;}
  if(el.id&&el.id.startsWith('sec_')){const wc=words(el.value),lim=S.sections[ui.section].word_limit,ph=(el.value.match(/\[[^\]]+\]/g)||[]).length;const w=document.getElementById('wc');w.textContent=`${wc} / ${lim} words${ph?` · ${ph} placeholder${ph>1?'s':''} in brackets`:''}`;w.className=`small ${wc>lim?'ph':'muted'}`;}
});
document.addEventListener('change',(e)=>{
  const el=e.target;const id=Number(el.closest('[data-id]')?.dataset.id);
  if(el.id==='import-json'){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const obj=JSON.parse(t);if(!obj.hospital||!obj.checklist)throw 0;S=obj;S.sample=false;save();render();toast('Backup imported');}catch{toast('That file is not an RHTP Navigator backup');}});return;}
  if(el.dataset.act==='hide-done'){ui.hideDone=el.checked;render();return;}
  if(el.dataset.act==='pick-state'){ui.stateCode=el.value;render();return;}
  if(el.dataset.act==='sec-status'){S.sections[ui.section].status=el.value;commit();render();return;}
  if(el.dataset.act==='sec-limit'){S.sections[ui.section].word_limit=Number(el.value)||0;commit();render();return;}
  if(el.dataset.c){const c=S.checklist.find(x=>x.id===id);if(!c)return;if(el.dataset.c==='toggle'){c.status=el.checked?'complete':'in_progress';commit(`${el.checked?'Completed':'Reopened'}: ${c.title}`);render();}else{c[el.dataset.c]=el.value;if(el.dataset.c==='status'){commit(`${label(el.value)}: ${c.title}`);render();}else save();}return;}
  if(el.dataset.r){const r=S.reports.find(x=>x.id===id);if(!r)return;r[el.dataset.r]=el.value;if(el.dataset.r==='status'&&el.value==='submitted'&&!r.submitted_at)r.submitted_at=today();if(el.dataset.r==='status'){commit(`${label(el.value)}: ${r.title}`);render();}else save();return;}
  if(el.dataset.m){const m=S.milestones.find(x=>x.id===id);if(!m)return;m[el.dataset.m]=el.value;if(el.dataset.m==='status'){commit(`${label(el.value)}: ${m.title}`);render();}else save();return;}
});

load();render();
</script>
